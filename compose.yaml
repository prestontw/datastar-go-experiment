name: patient-dashboard

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: patient_dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d patient_dashboard"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    profiles: ["app"]
    image: patient-dashboard:dev
    build:
      context: .
      dockerfile: Dockerfile
    # scripts/docker-up.sh supplies the host IDs. This keeps the scratch image
    # unprivileged while allowing it to read the owner-only bind-mounted key.
    user: "${LOCAL_UID:-65532}:${LOCAL_GID:-65532}"
    environment:
      ADDR: ":8443"
      DATABASE_URL: "postgres://dashboard:dashboard@postgres:5432/${DATABASE_NAME:-patient_dashboard}?sslmode=disable"
      APP_SECRET: "${APP_SECRET:-docker-development-only-secret-change-before-deploying}"
      TLS_CERT_FILE: "/certs/localhost.pem"
      TLS_KEY_FILE: "/certs/localhost-key.pem"
    ports:
      - "${APP_PORT:-8443}:8443"
    volumes:
      - ./.certs/localhost.pem:/certs/localhost.pem:ro
      - ./.certs/localhost-key.pem:/certs/localhost-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
